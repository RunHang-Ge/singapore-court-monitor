<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ActiveSG 空场提醒</title>
<style>body{font:16px/1.6 system-ui;background:#f4f6f8;color:#182938;max-width:1000px;margin:30px auto;padding:0 20px}section{background:white;border:1px solid #dee5ed;border-radius:14px;padding:24px;margin:20px 0}h1{font-size:26px}h2{font-size:20px}button,input{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid #bac7d5}button{cursor:pointer;background:#eff5ff}pre{white-space:pre-wrap;font:inherit}#screen{width:100%;height:auto;border:1px solid #dee5ed;cursor:crosshair}#message{color:#8a3d14}details p{color:#536778}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}input{max-width:65%}</style></head>
<body><h1>ActiveSG 空场提醒</h1><p>在 Telegram 私聊中修改条件、查看结果和暂停监控。</p>
<section><h2>运行状态</h2><pre id="status">正在读取…</pre><p id="connection"></p><p id="memory"></p><pre id="binding"></pre></section>
<section><h2>网站验证与浏览器</h2><p>出现验证时，先在 Telegram 发送 /pause。点击刷新画面，直接点击画面中的按钮；处理完成后发送 /resume。</p><p>此入口可查看并操作服务浏览器；网站仍可能拒绝云端访问。查询结束后会释放浏览器；手动操作闲置两分钟后也会关闭，Cookie 保留在磁盘。</p>
<div class="actions"><button id="refresh">刷新画面</button><button id="open">打开 ActiveSG 活动页</button><button id="up">向上滚动</button><button id="down">向下滚动</button><button id="close">关闭浏览器释放内存</button></div>
<p id="message" role="status"></p><img id="screen" alt="服务浏览器画面" hidden>
<div class="actions"><input id="text" type="password" placeholder="输入到浏览器当前选中的输入框" autocomplete="off"><button id="type">输入文字</button><button id="enter">Enter</button><button id="tab">Tab</button><button id="back">退格</button></div>
<details><summary>首次绑定</summary><p>若尚未设置 Telegram 用户 ID，在机器人私聊发送 /start 后加上你在 Render 设置的 BINDING_CODE。完成绑定后发送 /help。</p></details>
</section><script nonce="__CSRF__">
const csrf='__CSRF__';let currentImage;
const $=id=>document.getElementById(id);
async function state(){try{const r=await fetch('/status');if(!r.ok)throw Error('状态读取失败');const s=await r.json();$('status').textContent=s.text;const m=s.memory;$('memory').textContent=(m.container_mib===null?'当前环境无法读取容器内存。':'容器内存：'+m.container_mib+' MiB'+(m.limit_mib===null?'':' / '+m.limit_mib+' MiB'))+' 浏览器：'+(s.browser_active?'已打开':'已释放');$('connection').textContent=s.telegram_connected?'Telegram 已连接'+(s.bound?'，账号已绑定。':'，等待账号绑定。'):s.connection_error||'Telegram 正在连接…';$('binding').textContent=s.binding_command?'请在 @activeSG_monitor_bot 私聊中发送以下指令完成绑定：\n'+s.binding_command:'';if(!s.persistent_disk_configured)$('connection').textContent+=' 请确认已配置持久磁盘。';}catch(e){$('connection').textContent=e.message}}
async function refresh(){try{$('message').textContent='正在读取画面…';const r=await fetch('/browser/screenshot');if(!r.ok){const e=await r.json();throw Error(e.detail)}const blob=await r.blob();if(currentImage)URL.revokeObjectURL(currentImage);currentImage=URL.createObjectURL(blob);$('screen').src=currentImage;$('screen').hidden=false;$('message').textContent='可点击画面中的按钮。';}catch(e){$('message').textContent=e.message}}
async function action(data){try{const r=await fetch('/browser/action',{method:'POST',headers:{'Content-Type':'application/json','x-monitor-csrf':csrf},body:JSON.stringify(data)});if(!r.ok){const e=await r.json();throw Error(e.detail)}if(data.action==='close'){if(currentImage){URL.revokeObjectURL(currentImage);currentImage=null}$('screen').hidden=true;$('message').textContent='浏览器已关闭，已保存的条件和 Cookie 保留。';state()}else setTimeout(refresh,600)}catch(e){$('message').textContent=e.message}}
$('close').onclick=()=>action({action:'close'});$('refresh').onclick=refresh;$('open').onclick=()=>action({action:'open'});$('up').onclick=()=>action({action:'scroll',dy:-600});$('down').onclick=()=>action({action:'scroll',dy:600});$('type').onclick=()=>{action({action:'type',text:$('text').value});$('text').value=''};for(const [id,key] of [['enter','Enter'],['tab','Tab'],['back','Backspace']])$(id).onclick=()=>action({action:'key',key});
$('screen').onclick=e=>{const box=e.target.getBoundingClientRect();action({action:'click',x:Math.round((e.clientX-box.left)*1280/box.width),y:Math.round((e.clientY-box.top)*900/box.height)})};state();setInterval(state,8000);
</script></body></html>
